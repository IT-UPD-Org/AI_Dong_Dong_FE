<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #fff;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      const particleCount = 2000;
      const particles = [];
      let isFormed = false;

      // 1. Khởi tạo mảng hạt ngẫu nhiên
      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.originX = this.x;
          this.originY = this.y;
          this.targetX = this.x;
          this.targetY = this.y;
          this.color = "#333";
          this.size = Math.random() * 1.5 + 0.5;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
        }

        update() {
          // Lerp mượt mà tới vị trí mục tiêu
          this.x += (this.targetX - this.x) * 0.05;
          this.y += (this.targetY - this.y) * 0.05;

          // Trôi nhẹ khi ở trạng thái tự do
          if (!isFormed) {
            this.targetX += this.vx;
            this.targetY += this.vy;
            if (this.targetX < 0 || this.targetX > width) this.vx *= -1;
            if (this.targetY < 0 || this.targetY > height) this.vy *= -1;
          }
        }

        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }

      // 2. Lấy tọa độ từ chữ/hình
      function getTargetPoints(text) {
        const offscreen = document.createElement("canvas");
        const offCtx = offscreen.getContext("2d");
        offscreen.width = width;
        offscreen.height = height;

        offCtx.fillStyle = "#000";
        offCtx.font = "bold 200px sans-serif";
        offCtx.textAlign = "center";
        offCtx.textBaseline = "middle";
        offCtx.fillText(text, width / 2, height / 2);

        const imageData = offCtx.getImageData(0, 0, width, height).data;
        const points = [];

        // Quét điểm theo lưới step
        const step = 6;
        for (let y = 0; y < height; y += step) {
          for (let x = 0; x < width; x += step) {
            const index = (y * width + x) * 4;
            if (imageData[index + 3] > 128) {
              points.push({ x, y });
            }
          }
        }
        return points;
      }

      // 3. Đổi hình dạng khi Click
      window.addEventListener("click", () => {
        isFormed = !isFormed;
        if (isFormed) {
          const targets = getTargetPoints("{ }"); // Lấy hình ngoặc nhọn
          particles.forEach((p, idx) => {
            if (idx < targets.length) {
              p.targetX = targets[idx].x + (Math.random() - 0.5) * 10;
              p.targetY = targets[idx].y + (Math.random() - 0.5) * 10;
              p.color = "#2563eb"; // Đổi sang màu xanh lam giống ảnh
            }
          });
        } else {
          particles.forEach((p) => {
            p.targetX = Math.random() * width;
            p.targetY = Math.random() * height;
            p.color = "#333";
          });
        }
      });

      // Loop Animation
      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach((p) => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
