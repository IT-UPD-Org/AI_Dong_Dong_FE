<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <title>IT UPD GenAI</title>
    <style>html{color:#11130f;background:#fff}html.dark{color:#f5f5f5;background:#121212}</style>
    <!--
      Apply the saved theme before the first paint to avoid a flash of the
      wrong theme. The key matches THEME_STORAGE_KEY in ThemeProvider.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("itupd-theme");
          // Carry over a choice saved under next-themes' previous default key.
          if (!stored) {
            stored = localStorage.getItem("theme");
            if (stored) localStorage.setItem("itupd-theme", stored);
          }
          var dark = stored === "dark" ||
            ((!stored || stored === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-q28UMyun.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BQltiEla.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
